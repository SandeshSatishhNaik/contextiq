<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2A66">
  <title>ContextIQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%227%22 fill=%22%23009CDE%22/%3E%3Cpath d=%22M12 12L24 12A12 12 0 0 1 12 24Z%22 fill=%22%23FFC439%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=6">
</head>
<body>
<header class="nav" id="nav" hidden>
  <div class="nav-in">
    <a class="brand" href="#home" aria-label="ContextIQ home"><span class="mark" aria-hidden="true"></span>ContextIQ</a>
    <nav class="links" aria-label="Main">
      <button data-tab="home">Home</button>
      <button data-tab="cart">Cart</button>
      <button data-tab="budget">Budget</button>
      <button data-tab="invest" class="minor">Invest</button>
      <button data-tab="history">History</button>
      <div class="more-wrap">
        <button class="more-btn" id="morebtn" type="button" aria-expanded="false" aria-haspopup="true">More</button>
        <div class="dropdown more-menu" id="moremenu" hidden>
          <button data-tab="notices">1-Way Notices</button>
          <a href="/console">Under the hood: agents, models, audit</a>
          <button id="tourbtn" type="button">Judge tour</button>
        </div>
      </div>
    </nav>
    <div class="nav-right">
      <div class="acct role" id="role" role="group" aria-label="Viewing as">
        <button data-user="alex" aria-pressed="true">Buyer</button>
        <button data-user="brightmart" aria-pressed="false">Seller</button>
      </div>
      <div class="acct" id="acct" role="group" aria-label="Active account"></div>
      <button class="nav-icon" id="mic" aria-label="Ask by voice" aria-pressed="false"></button>
      <div class="bell-wrap">
        <button class="nav-icon" id="bell" aria-label="Notifications" aria-expanded="false"><span class="badge" id="badge" hidden></span></button>
        <div class="dropdown" id="notes" hidden></div>
      </div>
      <button class="avatar" id="me" aria-label="Your settings"></button>
    </div>
  </div>
</header>

<div class="tour" id="tour" hidden></div>
<main id="app" tabindex="-1"></main>

<button class="ask-fab" id="askfab" hidden><span class="dot"></span>Ask ContextIQ</button>
<aside class="assistant" id="assistant" hidden aria-label="Assistant">
  <div class="as-head"><b>ContextIQ assistant</b><button class="x" id="asclose" aria-label="Close">×</button></div>
  <div class="as-log" id="log" aria-live="polite"></div>
  <div class="chips" id="sugg"></div>
  <form class="as-bar" id="askf"><input id="q" placeholder="Ask about a purchase, cart item, bill or budget" autocomplete="off" aria-label="Your question"><button class="btn primary">Send</button></form>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="sheet" class="modal"><button class="x modal-x" aria-label="Close" onclick="this.closest('dialog').close()">×</button><div class="modal-body" id="sheet-body"></div></dialog>

<dialog id="stepup" class="modal">
  <div class="modal-body">
    <h2>Confirm it's you</h2>
    <p class="muted" id="stepup-why"></p>
    <p class="hint">In the real app this code arrives on your phone. For the demo it's here: <strong id="stepup-code" class="num"></strong></p>
    <label class="field">6-digit code<input type="text" id="stepup-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
    <button class="btn primary wide" id="stepup-ok">Confirm payment</button>
    <button class="btn ghost wide" id="stepup-cancel">Cancel</button>
  </div>
</dialog>

<script src="/static/app.js?v=6"></script>
</body>
</html>
