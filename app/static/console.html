<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContextIQ — Under the hood</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
<div style="background:#12263A;color:#fff;padding:8px 16px;font-size:14px;text-align:center">Under the hood — the judges' console. It shows the agents, models, signatures and security decisions behind the app. The app people use is at <a href="/" style="color:#F2B84B">/</a>.</div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" aria-label="ContextIQ">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="8" width="28" height="20" rx="5" fill="#0b2e6f"/><path d="M11 8V6a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v2" fill="none" stroke="#0b2e6f" stroke-width="2.5"/><path d="M9 18l4.5 4L23 13" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ContextIQ
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="home" aria-current="page">Home</button>
      <button data-view="pay">Pay</button>
      <button data-view="activity">Activity</button>
      <button data-view="money">Money</button>
      <button data-view="business">Business</button>
      <button data-view="ask">Assistant</button>
      <button data-view="trust">Trust</button>
      <button data-view="features">All features</button>
    </nav>
    <div class="right">
      <button class="btn btn-quiet" id="demo-reset-btn" title="Reset all demo data to baseline" style="font-size:12px;padding:4px 9px;border-radius:4px;cursor:pointer;background:#eef2f7;border:1px solid #cbd5e1;font-weight:600;margin-right:6px">↺ Reset Demo</button>
      <button class="mic" id="mic" aria-pressed="false" title="Ask by voice" aria-label="Ask by voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <label class="small muted" for="who" style="position:absolute;left:-9999px">Signed in as</label>
      <select id="who"></select>
    </div>
  </div>
</header>
<div class="envbar" id="env" hidden></div>
<main id="view" tabindex="-1"></main>

<dialog id="stepup">
  <h2>Confirm it's you</h2>
  <p class="muted" id="stepup-why"></p>
  <p class="small muted">In the real app this code arrives on your phone. For this demo it's shown here: <strong id="stepup-code" class="num"></strong></p>
  <label class="field">6-digit code<input type="text" id="stepup-input" inputmode="numeric" autocomplete="one-time-code"></label>
  <div class="row" style="margin-top:18px"><button class="btn btn-money" id="stepup-ok"></button><button class="btn btn-quiet" id="stepup-cancel">Cancel</button></div>
  <div style="margin-top:14px" ><button class="btn btn-primary" id="stepup-pk" hidden>Use my passkey instead</button></div>
</dialog>
<script src="/static/qrcode.js"></script>
<script src="/static/console.js"></script>
</body>
</html>
